name: vaistu_priminimo_sistema
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  provider: ^6.1.5+1
  cloud_firestore: ^6.1.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  uuid: ^4.5.3
  fl_chart: ^1.2.0
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.15.1
  permission_handler: ^12.0.1
  firebase_storage: ^13.2.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.3
  flutter_native_splash: ^2.4.7
  table_calendar: ^3.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" 

flutter_native_splash:
  android: true
  ios: true
  image: "assets/icon/icon_circle.png" 
  color: "#FFFFFF"

  android_12:
    image: "assets/icon/icon_circle.png" 
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/lottie_animations/loading.json
